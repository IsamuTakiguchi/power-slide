name: CI

# push と pull_request の両方を全ブランチで拾うと、PR のあるブランチでは
# 同じコミットに対して 2 回走ってしまう。ブランチへの push は pull_request 側に任せ、
# push では main だけを見る。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチへ続けて push したときは、古い実行を打ち切る。
# pull_request と push では github.ref が別物になるため、PR では head_ref を使う。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェック・Lint・E2E テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Electron の起動に必要な仮想ディスプレイ（GitHub の ubuntu ランナーには
      # xvfb が入っているが、念のため明示的に導入する）
      - name: xvfb を用意
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Web 版のテストは Playwright の Chromium で走らせる
      - name: Chromium を用意
        run: npx playwright install --with-deps chromium

      - name: E2E スモークテスト（デスクトップ版・Web 版）
        run: npm run test:smoke

      - name: 失敗時のスクリーンショットを残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
