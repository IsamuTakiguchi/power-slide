name: Web 版を公開

# main に入るたびに Web 版（PWA）をビルドし、GitHub Pages に置く。
# 公開 URL: https://<owner>.github.io/power-slide/
# 初回は Settings → Pages で Source を「GitHub Actions」にしておく
# （configure-pages の enablement が権限のある場合は自動で有効にする）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Web 版をビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: ビルド
        run: npm run build:web

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web

  deploy:
    name: GitHub Pages に配置
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
