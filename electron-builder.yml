appId: com.isamutakiguchi.powerslide
productName: Power Slide
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/*.map'
  # 型定義だけのパッケージは実行時に不要
  - '!node_modules/@types/**'
  - '!node_modules/undici-types/**'

# .pslide をアプリに関連付ける
fileAssociations:
  - ext: pslide
    name: Power Slide プレゼンテーション
    description: Power Slide のスライドファイル
    role: Editor

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]

linux:
  category: Office
  target:
    - target: AppImage
      arch: [x64]
